<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANS UK — Secure Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary:    #060810;
      --bg-secondary:  #0b0f1a;
      --bg-card:       rgba(13, 20, 40, 0.9);
      --border:        rgba(0, 180, 255, 0.15);
      --border-bright: rgba(0, 180, 255, 0.5);
      --accent-cyan:   #00c8ff;
      --accent-blue:   #0066ff;
      --accent-green:  #00ff87;
      --accent-red:    #ff2d55;
      --text-primary:  #e8f4fd;
      --text-secondary: rgba(180, 210, 240, 0.7);
      --text-muted:    rgba(120, 160, 200, 0.5);
      --font-mono:     'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,180,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      animation: gridShift 20s linear infinite;
    }

    @keyframes gridShift {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 60px 60px, 60px 60px; }
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(0,102,255,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 1rem;
    }

    /* Brand header above card */
    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 1rem;
      box-shadow: 0 0 30px rgba(0,200,255,0.25), 0 0 60px rgba(0,100,255,0.1);
    }

    .brand-name {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* Login card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(24px);
      box-shadow:
        0 4px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    /* Form */
    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--border-bright);
      box-shadow: 0 0 0 3px rgba(0,200,255,0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    /* Error banner */
    .error-banner {
      display: none;
      background: rgba(255,45,85,0.1);
      border: 1px solid rgba(255,45,85,0.35);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.8rem;
      color: var(--accent-red);
      margin-bottom: 1.25rem;
      font-family: var(--font-mono);
    }

    .error-banner.visible { display: block; }

    /* Submit button */
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(0,200,255,0.2);
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.9;
      box-shadow: 0 0 30px rgba(0,200,255,0.35);
    }

    .btn-login:active:not(:disabled) { transform: scale(0.98); }

    .btn-login:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Spinner inside button */
    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }

    /* Footer */
    .card-footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .status-text {
      font-size: 0.72rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    /* Copyright */
    .copyright {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="brand">
      <div class="brand-logo">🚦</div>
      <div class="brand-name">VANS UK</div>
      <div class="brand-sub">Vehicle Alert Notification System</div>
    </div>

    <div class="card">
      <div class="card-title">Admin Access</div>
      <div class="card-subtitle">Sign in to access the enforcement dashboard</div>

      <div class="error-banner" id="errorBanner"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="admin"
            required
            autofocus
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="card-footer">
        <div class="status-dot"></div>
        <div class="status-text" id="systemStatus">Checking system status…</div>
      </div>
    </div>

    <div class="copyright">© 2026 Belloite Ltd — All rights reserved</div>
  </div>

  <script>
    // Check if already authenticated — redirect straight to dashboard
    fetch('/auth/status', { credentials: 'include' })
      .then(r => r.json())
      .then(d => {
        if (d.authenticated) window.location.replace('/');
      })
      .catch(() => {});

    // System health status in footer
    fetch('/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('systemStatus').textContent =
          'System ' + (d.status === 'ok' ? 'online' : d.status || 'online') +
          ' — VANS UK v1.0';
      })
      .catch(() => {
        document.getElementById('systemStatus').textContent = 'VANS UK Enforcement Platform';
      });

    async function handleLogin(e) {
      e.preventDefault();
      const btn    = document.getElementById('loginBtn');
      const banner = document.getElementById('errorBanner');
      const user   = document.getElementById('username').value.trim();
      const pass   = document.getElementById('password').value;

      banner.classList.remove('visible');
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username: user, password: pass }),
        });

        if (resp.ok) {
          const data = await resp.json();
          window.location.replace(data.redirect || '/');
        } else {
          let msg = 'Invalid username or password.';
          try { msg = (await resp.json()).detail || msg; } catch (_) {}
          banner.textContent = msg;
          banner.classList.add('visible');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        banner.textContent = 'Network error — please check your connection.';
        banner.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }
  </script>
</body>
</html>
