# VANS UK - Local Development
# Run: docker-compose up --build

services:
  # ─── Infrastructure ───────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: vans_uk
      POSTGRES_USER: vans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vans_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vans -d vans_uk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── API Server (single process with in-process pipeline) ─
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vans:${POSTGRES_PASSWORD:-vans_dev_password}@postgres:5432/vans_uk
      DVLA_API_KEY: ${DVLA_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
